[experiment]
name = "gate1-m1max-qwen36-q4-v4"
model_repo = "mlx-community/Qwen3.6-35B-A3B-4bit"
model_revision = "38740b847e4cb78f352aba30aa41c76e08e6eb46"
prompt_file = "configs/prompts/gate1-code.txt"
context_tokens = 4096
max_tokens = 256
seed = 104729
warmups = 1
repetitions = 5
sample_interval_seconds = 0.5
start_min_free_percent = 40.0
recovery_stable_samples = 3
recovery_timeout_seconds = 60
min_free_percent = 25.0
max_swap_delta_mib = 384
warmup_max_swap_delta_mib = 768
timeout_seconds = 1200
adapter = "command-json-v1"
worker_process_name = "slipstream"
required_power_source = "AC Power"
require_low_power_mode_off = true
require_no_thermal_warning = true
require_native_pressure_monitor = true
require_output_parity = true
require_token_id_parity = false
require_expert_telemetry = true
fail_fast = true
allow_live_pressure = false

# Version 4 preserves v3's arms and every measured-row threshold. V3 showed
# that 96-slot prefill performs one-time OS displacement during warmup. Warmups
# may grow swap by at most 768 MiB while measured rows retain the 384 MiB limit;
# the 25% free and native-critical stops are unchanged. Earlier raw data remains immutable.
[[arms]]
name = "cache-slots-16"
cache_mib = 1136
command = [
  "python3", "scripts/run_pinned_runtime.py",
  "--model", "{model_path}", "--prompt-file", "{prompt_file}",
  "--cache-mib", "{cache_mib}", "--context", "{context_tokens}",
  "--max-tokens", "{max_tokens}", "--seed", "{seed}",
  "--result", "{result_path}",
]

