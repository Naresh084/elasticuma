[experiment]
name = "qwen38-27b-mlx-dense-control-v1"
model_repo = "mlx-community/Qwen3.8-27B-4bit"
model_revision = "3e6447f082e89cc7f0bc6e5441afd38dfce760ff"
prompt_file = "configs/prompts/qwen38-dense-control.txt"
context_tokens = 4096
max_tokens = 128
seed = 104729
warmups = 1
repetitions = 5
sample_interval_seconds = 0.25
start_min_free_percent = 40.0
recovery_stable_samples = 3
recovery_timeout_seconds = 90
min_free_percent = 20.0
max_swap_delta_mib = 384
warmup_max_swap_delta_mib = 768
timeout_seconds = 1200
adapter = "command-json-v1"
required_power_source = "AC Power"
require_low_power_mode_off = true
require_no_thermal_warning = true
require_native_pressure_monitor = true
require_output_parity = true
require_token_id_parity = false
require_expert_telemetry = false
fail_fast = true
allow_live_pressure = false

# cache_mib is the immutable published checkpoint size label for this dense
# control; no routed-expert cache exists.
[[arms]]
name = "mlx-vlm-qwen38-27b-q4"
cache_mib = 15336
metadata = { role = "dense-control", mlx_vlm = "0.6.14", mlx = "0.32.1" }
command = [
  ".runtime/qwen38-control-py312/bin/python",
  "scripts/run_qwen38_mlx_control.py",
  "--model", "{model_path}", "--prompt-file", "{prompt_file}",
  "--max-tokens", "{max_tokens}", "--seed", "{seed}",
  "--result", "{result_path}",
]
