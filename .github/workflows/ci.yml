name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run elasticuma --version
      - run: uv run euma --help
      - run: uv run euma app build --help
      - run: uv run euma models
      - run: uv build

  linux-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -k "not macos"
      - run: uv run euma models
      - name: Verify pinned runtime patch set
        run: |
          git init "$RUNNER_TEMP/elasticuma-runtime"
          git -C "$RUNNER_TEMP/elasticuma-runtime" fetch --depth=1 \
            https://github.com/dwijenpatel/slipstream.git \
            01f7d5e774ca940982ea3aa012bd880b5c9d634e
          git -C "$RUNNER_TEMP/elasticuma-runtime" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/elasticuma-runtime" apply --index \
            "$GITHUB_WORKSPACE/runtime/patches/elasticuma-purgeable.patch"
          git -C "$RUNNER_TEMP/elasticuma-runtime" apply --index \
            "$GITHUB_WORKSPACE/runtime/patches/elasticuma-app.patch"
          test "$(git -C "$RUNNER_TEMP/elasticuma-runtime" diff \
            --cached --binary --no-ext-diff | sha256sum | awk '{print $1}')" = \
            "a009e905b3483f9e894cc8627a58de1353437565b22f3e13107364c7acb4739b"
      - run: git diff --check
