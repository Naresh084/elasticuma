name: Model support request
description: Ask for a popular MoE checkpoint or architecture.
title: "model: "
labels: ["model-support"]
body:
  - type: input
    id: repository
    attributes:
      label: Checkpoint repository
      description: Link the official Hugging Face model page.
      placeholder: https://huggingface.co/owner/name
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Preferred checkpoint or quantization
      description: For example BF16, FP8, MLX 4-bit, GGUF, MXFP4, or NVFP4.
  - type: textarea
    id: architecture
    attributes:
      label: Why this model?
      description: Explain the use case and why the model is practical on your Mac.
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Current support expectation
      options:
        - Existing Qwen or Gemma path may match
        - New native architecture is required
        - Unknown
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Target Mac
      description: Chip, RAM, and available storage. Do not include a serial number or UUID.
  - type: checkboxes
    id: agreement
    attributes:
      label: Agreement
      options:
        - label: I checked the architecture matrix in docs/models.md.
          required: true
        - label: I will not upload model weights to this repository.
          required: true
